<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ec4899"><title>Pink Admin | Painel administrativo</title>
<style>
:root{--pink:#db2777;--ink:#211821;--muted:#766c76;--line:#f0dce7;--bg:#fffafd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff5fa,#fffafd 55%);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.brand{font-weight:800;color:var(--pink);letter-spacing:.2px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 12px 40px #67264b0b}h1{font-size:28px;margin:8px 0}p{color:var(--muted);line-height:1.5}.hidden{display:none!important}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:13px;border:1px solid #e8d5e0;border-radius:12px;font:inherit;background:#fff}button{border:0;border-radius:12px;padding:13px 16px;background:var(--pink);color:#fff;font-weight:750;font-size:14px;cursor:pointer}button.secondary{background:#fff;color:var(--pink);border:1px solid var(--line)}button:disabled{opacity:.6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:15px;background:#fff4f9;border-radius:14px}.stat strong{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.list{display:grid;gap:10px;margin-top:16px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.pill{font-size:11px;border-radius:99px;padding:5px 9px;background:#fce7f3;color:#9d174d;display:inline-block}.error{color:#b42318;font-size:13px}.ok{color:#18794e;font-size:13px}.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(min-width:700px){.item{grid-template-columns:1fr 180px;align-items:center}.item .details{min-width:0}}
</style></head><body><main class="wrap"><div class="brand">✦ PINK ADMIN</div>
<section id="login" class="card"><h1>Painel administrativo</h1><p>Entre com a senha de administrador configurada no Cloudflare. Esta área não usa a senha das revendedoras.</p><form id="loginForm"><label for="password">Senha administrativa</label><input id="password" type="password" autocomplete="current-password" required><div class="row" style="margin-top:16px"><button type="submit">Entrar com segurança</button><a href="/" style="color:#9d174d">Voltar ao site</a></div><p id="loginMsg" class="error" role="status"></p></form></section>
<section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between;margin-top:24px"><div><h1>Cadastros recebidos</h1><p>Dados enviados pelo formulário do site.</p></div><button id="logout" class="secondary">Sair</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total</span></div><div class="stat"><strong id="pending">0</strong><span>Pendentes</span></div><div class="stat"><strong id="approved">0</strong><span>Aprovados</span></div></div><div class="card"><div class="row"><input id="search" placeholder="Pesquisar nome, e-mail ou telefone"><button id="refresh" class="secondary">Atualizar</button></div><div id="list" class="list"><div class="empty">Carregando cadastros…</div></div><p id="dashMsg" role="status"></p></div></section></main>
<script>
const $=id=>document.getElementById(id);let all=[];
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Erro na solicitação.');return d}
function showDash(show){$('login').classList.toggle('hidden',show);$('dashboard').classList.toggle('hidden',!show)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Verificando…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('loginMsg').textContent='';showDash(true);await load()}catch(err){$('loginMsg').textContent=err.message}});
async function load(){try{const d=await api('/api/admin/registrations');all=d.registrations||[];render();$('dashMsg').textContent='';}catch(e){showDash(false);$('loginMsg').textContent=e.message}}
function render(){const q=$('search').value.toLowerCase();const rows=all.filter(x=>[x.name,x.email,x.phone,x.id].join(' ').toLowerCase().includes(q));$('total').textContent=all.length;$('pending').textContent=all.filter(x=>x.status==='Pendente').length;$('approved').textContent=all.filter(x=>x.status==='Aprovado').length;const list=$('list');list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">Nenhum cadastro encontrado.</div>';return}for(const x of rows){const item=document.createElement('article');item.className='item';const details=document.createElement('div');details.className='details';const name=document.createElement('strong');name.textContent=x.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=[x.email,x.phone||'Telefone não informado','Recebido: '+new Date(x.created_at).toLocaleString('pt-BR'),'Código: '+x.id].join(' · ');const pill=document.createElement('span');pill.className='pill';pill.textContent=x.status;details.append(name,document.createElement('br'),pill,meta);const controls=document.createElement('div');const select=document.createElement('select');for(const status of ['Pendente','Aprovado','Recusado']){const o=document.createElement('option');o.value=status;o.textContent=status;o.selected=status===x.status;select.append(o)}select.setAttribute('aria-label','Status de '+x.name);select.addEventListener('change',async()=>{try{await api('/api/admin/registrations/'+encodeURIComponent(x.id),{method:'PATCH',body:JSON.stringify({status:select.value})});x.status=select.value;render()}catch(e){$('dashMsg').textContent=e.message;load()}});controls.append(select);item.append(details,controls);list.append(item)}}
$('search').addEventListener('input',render);$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch{}showDash(false)});api('/api/admin/registrations').then(d=>{all=d.registrations||[];showDash(true);render()}).catch(()=>showDash(false));
</script></body></html>
